# Interface description of the BenchTare reference DUT.
# Its CAN signals come from reference.dbc; its supply lines are plain digital signals.

dut: reference

can:
  node: REFDEV
  dbc: [reference.dbc]

signals:
  supply_enable: {type: bool, direction: input}
  supply_ok: {type: bool, direction: output}

overrides:
  SwVersion: {unit: none}

# What each run records about the DUT. Names only: the values are collected during the run.
identity:
  software: {signal: SwVersion}

# What shows the DUT is clean, for the hygiene check (benchtare check-hygiene): after each test's
# teardown, these must be back at their clean values.
clean_state:
  Mode: standby
  Setpoint: 0.0
  Measured: 0.0
