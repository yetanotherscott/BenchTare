# A simulated bench: a virtual CAN interface, and simulated I/O with four outputs and four
# inputs. It names no DUT signals, so it works with either reference harness.

bench: laptop-sim

equipment:
  can0:
    backend: sim_can
  io:
    backend: sim
    channels:
      out1: {drive: true}
      out2: {drive: true}
      out3: {drive: true}
      out4: {drive: true}
      in1: {read: true}
      in2: {read: true}
      in3: {read: true}
      in4: {read: true}
