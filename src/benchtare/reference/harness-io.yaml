# The reference DUT on the simulated bench, with every signal on a simulated I/O channel and no
# CAN at all. The same DUT and bench as harness-can.yaml, wired differently.

harness: reference-io

connections:
  Setpoint: io.out1
  ModeRequest: io.out2
  supply_enable: io.out3
  Measured: io.in1
  Mode: io.in2
  supply_ok: io.in3
  SwVersion: io.in5

loopbacks:
  - {drive: io.out4, read: io.in4}

presence:
  - {signal: Mode, within: 2.0}

simulate: reference
