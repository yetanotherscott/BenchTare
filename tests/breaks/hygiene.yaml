# --- repeating, and a meaningful start ---------------------------------------------------------

- id: failing-repeat-passes
  guards: A test that fails when run again straight after itself doesn't repeat
  file: src/benchtare/plugin.py
  find: |2-
        if not call.passed:
            return result(
                hygiene.FAILED,
  replace: |2-
        if False:
            return result(
                hygiene.FAILED,
  caught_by:
    - tests/test_check_hygiene.py::test_a_test_that_doesnt_repeat_is_not_clean

- id: repeat-readings-not-compared
  guards: A test that takes other readings when run again doesn't repeat
  file: src/benchtare/plugin.py
  find: "    if again != first:"
  replace: "    if False:"
  caught_by:
    - tests/test_check_hygiene.py::test_a_test_that_takes_different_readings_when_repeated_is_not_clean

- id: wait-already-satisfied-not-noted
  guards: A wait already satisfied by the value from before its write is noted
  file: src/benchtare/bench/runtime.py
  find: |2
            if already:
                signal, where = self.last_write
  replace: |2
            if False:
                signal, where = self.last_write
  caught_by:
    - tests/test_hygiene.py::test_a_wait_already_satisfied_before_the_write_is_noted
    - tests/test_check_hygiene.py::test_a_wait_already_satisfied_before_its_write_is_not_a_meaningful_start

- id: unchecked-wait-judged
  guards: A wait marked check=False isn't judged for a meaningful start
  file: src/benchtare/bench/runtime.py
  find: "        if before is None or self.last_write is None or not reading.checked:"
  replace: "        if before is None or self.last_write is None:"
  caught_by:
    - tests/test_hygiene.py::test_a_wait_already_satisfied_before_the_write_is_noted

- id: meaningful-start-ignores-the-repeat
  guards: A meaningful start is judged on the repeat too, where the test starts from its own end
  file: src/benchtare/plugin.py
  find: "        waits = [(run, r) for run, taken in ((1, first), (2, repeat)) for r in taken]"
  replace: "        waits = [(run, r) for run, taken in ((1, first),) for r in taken]"
  caught_by:
    - tests/test_check_hygiene.py::test_a_staging_without_its_own_starting_point_shows_on_the_repeat

# --- the verdict -------------------------------------------------------------------------------

- id: broken-rule-still-clean
  guards: A test that breaks any checked rule isn't clean
  file: src/benchtare/hygiene.py
  find: |2
        if any(rule.outcome == FAILED for rule in rules):
            return NOT_CLEAN
  replace: ""
  caught_by:
    - tests/test_hygiene.py::test_the_verdict[passed-outcomes2-not clean]
    - tests/test_hygiene.py::test_the_verdict[passed-outcomes3-not clean]
    - tests/test_hygiene.py::test_the_verdict[passed-outcomes4-not clean]

- id: unclean-test-passes-the-check
  guards: A test that isn't clean fails the hygiene check, even though every test passed
  file: src/benchtare/plugin.py
  find: "        unclean = any(test.verdict == hygiene.NOT_CLEAN for test in self.hygiene_checked)"
  replace: "        unclean = False"
  caught_by:
    - tests/test_cli.py::test_check_hygiene_exits_1_when_a_test_isnt_clean
