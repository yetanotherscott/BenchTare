# Breaks for the hygiene check: its three rules (it repeats, it leaves the DUT clean, it starts
# from a meaningful state) and its verdict. Each break takes one behaviour away; every test it
# names must then fail. See docs/testing.md.

# --- comparing an item -------------------------------------------------------------------------

- id: tolerance-ignored
  guards: Two numbers within an item's tolerance are the same
  file: src/benchtare/hygiene.py
  find: "        return abs(after - before) <= tolerance"
  replace: "        return after == before"
  caught_by:
    - tests/test_hygiene.py::test_same[42.0-42.05-0.1-True]

- id: tolerance-stretches-bools
  guards: A tolerance never makes True and False the same, though Python counts them as numbers
  file: src/benchtare/hygiene.py
  find: "    return isinstance(value, numbers.Real) and not isinstance(value, bool)"
  replace: "    return isinstance(value, numbers.Real)"
  caught_by:
    - tests/test_hygiene.py::test_same[True-False-1.0-False]

- id: settle-time-ignored
  guards: An item has its settle time to come back after teardown
  file: src/benchtare/hygiene.py
  find: |2
            remaining = deadline - clock()
            if remaining <= 0:
                return False, value
  replace: |2
            return False, value
  caught_by:
    - tests/test_hygiene.py::test_a_value_that_comes_back_within_its_settle_time_is_the_same

