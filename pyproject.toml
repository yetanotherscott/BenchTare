[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benchtare"
version = "0.0.1"
description = "A self-verifying HIL/SIL test framework for embedded systems, built on pytest."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Drew Scott" }]
keywords = ["hil", "sil", "embedded", "testing", "pytest", "can", "hardware-in-the-loop"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware",
]

# Runtime dependencies are added milestone by milestone (see docs/first-slice-plan.md).
# The 0.0.1 placeholder has none, so that it installs cleanly and reserves the name.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

# Add these when the modules exist (milestones M3 and M6):
#
# [project.scripts]
# benchtare = "benchtare.cli:main"
#
# [project.entry-points.pytest11]
# benchtare = "benchtare.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/benchtare"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
