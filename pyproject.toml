[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benchtare"
version = "0.0.1"
description = "A self-verifying HIL/SIL test framework for embedded systems, built on pytest."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Drew Scott" }]
keywords = ["hil", "sil", "embedded", "testing", "pytest", "can", "hardware-in-the-loop"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware",
]

# Runtime dependencies are added milestone by milestone (see docs/first-slice-plan.md).
dependencies = [
    "PyYAML>=6.0",     # interface description, bench and harness files (M1)
    "cantools>=45.0",  # DBC import into the interface description (M1)
    "python-can>=4.6", # virtual CAN bus for the sim_can backend (M2); LGPL-3.0, unmodified
    "pytest>=7.4",     # BenchTare is a pytest plugin (M3); CI tests this floor
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff"]

[project.entry-points.pytest11]
benchtare = "benchtare.plugin"

[project.scripts]
benchtare = "benchtare.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/benchtare"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
