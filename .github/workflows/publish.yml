name: Publish

# Runs when a GitHub release is published. It builds the package, checks that the release's tag
# matches the version in pyproject.toml, and uploads it to PyPI by trusted publishing: PyPI trusts
# this workflow, in this repository and environment, so no token is stored anywhere.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the release's tag matches the package version, and the changelog has it
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "The release's tag is $TAG, but pyproject.toml says version $version." \
              "Tag the release v$version, or change the version in pyproject.toml first."
            exit 1
          fi
          if ! grep -qF "## [$version] - " CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$version] - YYYY-MM-DD' section." \
              "Move the Unreleased lines under it before releasing."
            exit 1
          fi
      # build and twine run here only; neither is a dependency of BenchTare.
      - name: Build the sdist and the wheel, and check them
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Only this job can get an identity token, and only after the environment's rules allow it.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/benchtare/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
